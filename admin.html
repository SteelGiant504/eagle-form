<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/style.css"><title>回答データ出力</title></head><body><header><h1>事務局用 回答データ出力</h1></header><main><section class="card adminbox"><h2>Excel形式でダウンロード</h2><p class="help">Netlifyに設定した管理者パスワードを入力してください。回答一覧を .xlsx 形式で取得します。</p><label>管理者パスワード</label><input id="pw" type="password" autocomplete="current-password"><p id="msg" class="error" hidden></p><button id="dl" class="submit">Excelをダウンロード</button></section><a class="admin" href="/">回答フォームへ戻る</a></main><script type="module">document.querySelector('#dl').onclick=async()=>{const b=document.querySelector('#dl'),m=document.querySelector('#msg');m.hidden=true;b.disabled=true;b.textContent='作成しています…';try{const r=await fetch('/.netlify/functions/export',{headers:{'X-Admin-Password':document.querySelector('#pw').value}});if(!r.ok){const d=await r.json();throw new Error(d.error||'ダウンロードできませんでした')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='イーグル会回答一覧.xlsx';a.click();URL.revokeObjectURL(a.href)}catch(e){m.textContent=e.message;m.hidden=false}finally{b.disabled=false;b.textContent='Excelをダウンロード'}};</script></body></html>
