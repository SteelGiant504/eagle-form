<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回答の変更・取消し</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#172033;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#022c22,#047857);color:#fff;text-align:center;padding:38px 16px 78px}main{max-width:720px;margin:-46px auto 50px;padding:0 14px}.card{background:#fff;border-radius:22px;padding:clamp(20px,5vw,32px);box-shadow:0 16px 42px #0f172a22}h1,h2{margin-top:0}label{display:block;font-weight:700;font-size:14px;margin:15px 0 7px}input,select{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:11px;padding:0 12px;font-size:16px}button{border:0;border-radius:11px;min-height:48px;padding:0 16px;font-weight:700;cursor:pointer}.primary{background:#047857;color:#fff}.secondary{background:#e2e8f0}.danger{background:#b91c1c;color:#fff}.full{width:100%;margin-top:18px}.hidden{display:none!important}.error,.ok{padding:12px;border-radius:10px;margin-top:14px}.error{background:#fef2f2;color:#b91c1c}.ok{background:#ecfdf5;color:#065f46}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.person{background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;padding:14px;margin-top:13px}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1}.back{display:block;text-align:center;color:#475569;margin-top:18px}.note{color:#64748b;font-size:13px;line-height:1.7}@media(max-width:560px){.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head><body><header><h1>回答の変更・お取消し</h1></header><main><section id="login" class="card"><h2>登録内容を確認</h2><p class="note">登録時の代表者名とメールアドレスを入力してください。</p><label>代表者名</label><input id="loginName" autocomplete="name"><label>メールアドレス</label><input id="loginEmail" type="email" autocomplete="email"><p id="loginMsg" class="error hidden"></p><button id="loginBtn" class="primary full">登録内容を表示</button></section>
<section id="editor" class="card hidden"><h2>登録内容の変更</h2><div class="grid"><div><label>出欠</label><select id="attendance"><option>出席</option><option>欠席</option></select></div><div><label>ご人数</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div><label>御社名</label><input id="company"></div><div><label>代表者名</label><input id="representative"></div></div><label>代表者メールアドレス</label><input id="email" disabled><p class="note">重複登録防止のため、メールアドレスは変更できません。</p><div id="participants"></div><p id="editMsg" class="hidden"></p><div class="actions"><button id="save" class="primary">変更を保存</button><button id="cancelRegistration" class="danger">登録を取り消す</button></div></section><a class="back" href="/">回答フォームへ戻る</a></main><script>
const $=s=>document.querySelector(s);let credentials={representative:"",email:""},record=null;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(method,body){let url="/.netlify/functions/guest-response";const opt={method,headers:{"Content-Type":"application/json"}};if(method==="GET"){url+=`?representative=${encodeURIComponent(credentials.representative)}&email=${encodeURIComponent(credentials.email)}`}else opt.body=JSON.stringify({...credentials,...body});const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||"処理に失敗しました。");return d}
function fields(count){$("#participants").innerHTML=Array.from({length:count},(_,i)=>{const p=record?.participants?.[i]||{name:"",stay:"無し",golf:"無し"};return `<div class="person"><strong>参加者 ${i+1}</strong><label>参加者名</label><input class="pname" value="${esc(p.name)}"><div class="grid"><div><label>宿泊</label><select class="pstay"><option ${p.stay==="有り"?"selected":""}>有り</option><option ${p.stay!=="有り"?"selected":""}>無し</option></select></div><div><label>ゴルフ</label><select class="pgolf"><option ${p.golf==="有り"?"selected":""}>有り</option><option ${p.golf!=="有り"?"selected":""}>無し</option></select></div></div></div>`}).join("")}
function show(){ $("#attendance").value=record.attendance;$("#company").value=record.company;$("#representative").value=record.representative;$("#email").value=record.representativeEmail;$("#count").value=Math.max(1,record.participantCount||1);const absent=record.attendance==="欠席";$("#count").disabled=absent;fields(Number($("#count").value));$("#participants").classList.toggle("hidden",absent);$("#login").classList.add("hidden");$("#editor").classList.remove("hidden")}
$("#loginBtn").onclick=async()=>{credentials={representative:$("#loginName").value,email:$("#loginEmail").value};try{record=(await call("GET")).response;show()}catch(e){$("#loginMsg").textContent=e.message;$("#loginMsg").classList.remove("hidden")}};
$("#count").onchange=()=>fields(Number($("#count").value));$("#attendance").onchange=()=>{const absent=$("#attendance").value==="欠席";$("#count").disabled=absent;$("#participants").classList.toggle("hidden",absent)};
$("#save").onclick=async()=>{const attendance=$("#attendance").value;const participants=attendance==="出席"?[...document.querySelectorAll(".person")].map(p=>({name:p.querySelector(".pname").value,stay:p.querySelector(".pstay").value,golf:p.querySelector(".pgolf").value})):[];try{const d=await call("PUT",{response:{attendance,company:$("#company").value,representative:$("#representative").value,participants}});record=d.response;credentials.representative=record.representative;const m=$("#editMsg");m.textContent="変更を保存しました。";m.className="ok";show()}catch(e){const m=$("#editMsg");m.textContent=e.message;m.className="error"}};
$("#cancelRegistration").onclick=async()=>{if(!confirm("登録を取り消します。取り消した内容は元に戻せません。よろしいですか？"))return;try{await call("DELETE",{});alert("登録を取り消しました。");location.href="/"}catch(e){const m=$("#editMsg");m.textContent=e.message;m.className="error"}};
</script></body></html>
